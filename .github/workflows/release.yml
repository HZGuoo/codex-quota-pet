name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Universal 2 release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: version
        shell: zsh {0}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and package application
        env:
          CODEX_QUOTA_BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/package-release.sh

      - name: Prepare release notes
        shell: zsh {0}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "No CHANGELOG section found for $version." >&2
            exit 1
          fi
          cat >> dist/release-notes.md <<'EOF'

          > 此构建使用临时签名，尚未经过 Apple 公证。macOS 首次阻止启动时，请在 Finder 中右键应用并选择“打开”。
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal
          path: |
            dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip
            dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip" \
            "dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip.sha256" \
            --verify-tag \
            --latest \
            --title "Codex Quota Pet $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
