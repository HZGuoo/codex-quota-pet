name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Universal 2 release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: version
        shell: zsh {0}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select release signing mode
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: zsh {0}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" && \
                -n "$APPLE_CERTIFICATE_PASSWORD" && \
                -n "$APPLE_API_KEY_BASE64" && \
                -n "$APPLE_API_KEY_ID" && \
                -n "$APPLE_API_ISSUER_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: zsh {0}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/codex-quota-pet.keychain-db"
          print -rn -- "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)
          [[ -n "$identity" ]]
          echo "APPLE_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize application
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          CODEX_QUOTA_BUILD_NUMBER: ${{ github.run_number }}
        shell: zsh {0}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          print -rn -- "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          APPLE_API_KEY_FILE="$api_key_path" Scripts/package-notarized-release.sh

      - name: Build unsigned fallback package
        if: steps.signing.outputs.enabled != 'true'
        env:
          CODEX_QUOTA_BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/package-release.sh

      - name: Prepare release notes
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        shell: zsh {0}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "No CHANGELOG section found for $version." >&2
            exit 1
          fi
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            print '\n> This build is signed with Developer ID and notarized by Apple.\n' >> dist/release-notes.md
          else
            print '\n> This build is ad-hoc signed and not notarized. Control-click the app and choose Open on first launch.\n' >> dist/release-notes.md
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal
          path: |
            dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip
            dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip" \
            "dist/CodexQuotaPet-${{ steps.version.outputs.version }}-macos-universal.zip.sha256" \
            --verify-tag \
            --latest \
            --title "Codex Quota Pet $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: zsh {0}
        run: security delete-keychain "$RUNNER_TEMP/codex-quota-pet.keychain-db" || true
