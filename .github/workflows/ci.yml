name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  self-tests:
    name: Swift self-tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Validate version metadata
        shell: zsh {0}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          plutil -lint Resources/Info.plist

      - name: Run self-tests
        run: swift run --disable-sandbox CodexQuotaPetSelfTests
