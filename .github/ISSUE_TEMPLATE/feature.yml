name: Feature request
description: Propose a focused observability, compatibility, or workflow improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or Codex workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior, including CLI or export needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: How do you handle this today, including built-in Codex features?
  - type: checkboxes
    id: scope
    attributes:
      label: Project boundaries
      options:
        - label: The proposal can work without reading prompts, responses, or authentication tokens.
          required: true
