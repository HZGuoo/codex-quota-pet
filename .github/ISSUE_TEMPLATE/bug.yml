name: Bug report
description: Report a reproducible problem in the app, CLI, or Core library
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Codex Quota Pet. Remove tokens, prompts, responses, private paths, and proxy credentials before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS app
        - codex-observe CLI
        - CodexQuotaPetCore
        - Build or release tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codex Quota Pet version
      placeholder: v0.2.5 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, architecture, and codex --version
      placeholder: macOS 15.6, arm64, codex-cli 0.x.y
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed authentication tokens, prompts, responses, proxy credentials, and private repository paths.
          required: true
